name: Validate brand sources and contracts

on:
  pull_request:
  push:
    branches: [main, 'work/**']

permissions:
  contents: read

jobs:
  source-and-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned local test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-dev.txt
      - name: Validate package inventory
        run: .venv/bin/python scripts/validate_package.py
      - name: Check local contracts and negative cases
        run: .venv/bin/python -m unittest discover -s tests -v
